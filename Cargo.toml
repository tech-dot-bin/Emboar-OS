[workspace]
members = [
    "src/kernel",
    "src/init",
    "src/services",
    "src/libs",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Emboar OS Team"]
license = "GPL-3.0"


[profile.dev]
opt-level = 0
debug = true

[package]
name = "emboar-os"
version = "1.0.0"
edition = "2026"
authors = ["Softcore S.R.L."]
description = "A secure, modular operating system"
repository = "https://github.com/emboar/emboar-os"
license = "Apache-2.0"

# Security & Supply Chain
[package.metadata.deny]
# Prevent dependency confusion
version = "2.0"

[package.metadata.audit]
# Vulnerability scanning
ignore = []

# Development dependencies for testing
[dev-dependencies]
criterion = "0.5"           # Benchmarking
proptest = "1.0"            # Property-based testing
tempfile = "3.0"            # Temporary test files
mockito = "1.2"             # HTTP mocking
rand = "0.8"                # Random number generation

# Profile optimizations
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = true
opt-level = 0
